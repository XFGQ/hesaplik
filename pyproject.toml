[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hesaplik"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff==0.15.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# B008: FastAPI'de Depends() argüman varsayılanında kullanılır — doğru, yanlış pozitif
# FURB157: Decimal("100") vs Decimal(100) — stil tercihi, para kodunda string tercih ediyoruz
ignore = ["B008", "FURB157"]
