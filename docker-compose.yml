name: hesaplik

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesaplik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?parola gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-hesaplik}
    ports:
      # Sadece localhost'a acilir, disariya degil. Yerel gelistirme icin gerekli.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      # Ilk acilista otomatik calisir (sirayla). Veri dizini doluysa atlanir.
      - ./db/init-test-db.sh:/docker-entrypoint-initdb.d/00-test-db.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesaplik}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Yerel gelistirmede kullanma: uvicorn'u host'ta --reload ile calistir.
  # Sunucuya alirken:  docker compose --profile server up -d
  api:
    profiles: ["server"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hesaplik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hesaplik}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  caddy:
    profiles: ["server"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [api]

  # GPU'yu sunucuya taktiginda:  docker compose --profile gpu up -d
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: >
      --model Qwen/Qwen3-8B-AWQ --quantization awq
      --max-model-len 4096 --enable-prefix-caching --gpu-memory-utilization 0.85
    volumes:
      - ./data/hf:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
