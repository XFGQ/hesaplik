# Hesaplık — duman.rinnesoft.com
# API (FastAPI + statik web) 127.0.0.1:8100'de. Diğer subdomain'lere dokunmaz.

server {
    listen 80;
    server_name duman.rinnesoft.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name duman.rinnesoft.com;

    # Cloudflare Origin sertifikası (tube.rinnesoft.com gibi)
    # İndirdiğin origin.txt / private.txt yollarını buraya yaz:
    ssl_certificate     /home/mkyd/Websites/duman.rinnesoft.com-SSL-TLS/origin.txt;
    ssl_certificate_key /home/mkyd/Websites/duman.rinnesoft.com-SSL-TLS/private.txt;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
