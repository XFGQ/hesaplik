name: hesaplik

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesaplik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?parola gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-hesaplik}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesaplik}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hesaplik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hesaplik}

      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}

      # NVIDIA NIM (bulut, Faz 4c) — dördüncü ve en öncelikli katman.
      # Boşsa hiç denenmez, sistem vLLM/Ollama/none'a düşer.
      NVIDIA_URL: ${NVIDIA_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_URL: ${GROQ_STT_URL:-https://api.groq.com/openai/v1}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3}
      GROQ_STT_TIMEOUT: ${GROQ_STT_TIMEOUT:-30}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen/qwen2.5-72b-instruct}

      VLLM_URL: ${VLLM_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      VLLM_TIMEOUT: ${VLLM_TIMEOUT:-30}
      # vLLM uzaktan aç/kapat ("Yol B"): Bosna'daki scripts/vllm-control.sh
      # bu tokenla GET /api/vllm-desired'ı çeker (bkz. deployment/README.md).
      VLLM_CONTROL_TOKEN: ${VLLM_CONTROL_TOKEN:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}

      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/data/backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}

      # Giriş (tek hesap, JWT) — bkz. .env.example için hash/secret üretme
      # komutları. Üçü de zorunlu: eksikse deploy başlamadan durur, sistemin
      # farkında olmadan kilitli (ya da yapılandırma hatasıyla açık) kalması
      # yerine.
      AUTH_USERNAME: ${AUTH_USERNAME:?giriş kullanıcı adı gerekli}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?bcrypt şifre hash'i gerekli}
      JWT_SECRET: ${JWT_SECRET:?jwt secret gerekli}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}

    volumes:
      - ${RESTIC_REPOSITORY:-./data/backups}:${RESTIC_REPOSITORY:-/data/backups}:ro

    ports:
      - "127.0.0.1:8100:8000"
      - "10.100.0.1:8100:8000"
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hesaplik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hesaplik}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?bot token gerekli}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}

      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}

      NVIDIA_URL: ${NVIDIA_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen/qwen2.5-72b-instruct}

      VLLM_URL: ${VLLM_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      VLLM_TIMEOUT: ${VLLM_TIMEOUT:-30}

      # Groq STT (Faz 5 — sesli komut). Boşsa sesli mesaj desteği kapalı.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_URL: ${GROQ_STT_URL:-https://api.groq.com/openai/v1}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3}
      GROQ_STT_TIMEOUT: ${GROQ_STT_TIMEOUT:-30}

    command: python -m app.bot.main

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
